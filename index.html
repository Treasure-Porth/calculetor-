<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="./index.css">
  <script src="https://kit.fontawesome.com/3dc5cce3e2.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="main-container">
    <div class="second-container" id="second-container">
      <span id="first-num"></span>
      <span id="sign"></span>
      <span id="second-num"></span>
      <br>
      <br>
      <br>
      <span id="result"></span>
    </div>
    <div class="number-container">
      <button onclick="one()">1</button>
      <button onclick="two()">2</button>
      <button onclick="plus()"><i class="fa-solid fa-plus"></i></button>
      <button onclick="three()">3</button>
      <button onclick="four()">4</button>
      <button onclick="minus()"><i class="fa-solid fa-minus"></i></button>
      <button onclick="five()">5</button>
      <button onclick="six()">6</button>
      <button onclick="gun()"><i class="fa-solid fa-xmark"></i></button>
      <button onclick="seven()">7</button>
      <button onclick="eight()">8</button>
      <button onclick="divide()"><i class="fa-solid fa-divide"></i></button>
      <button onclick="nine()">9</button>
      <button onclick="zero()">0</button>
      <button onclick="equal()">=</button>
      <button id="space" onclick="space()"></button>
      <button id="del" onclick="del()">AC</button>

  <script src="./index.js"></script>
</body>
</html>
